name: Deploy ZB

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY_ZB to deploy the checked-out commit to production.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zb-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/codex/vps-migration'
    name: Deploy checked-out ZB commit
    runs-on: [self-hosted, linux, ARM64, zb-production]
    environment:
      name: zb-production
    timeout-minutes: 20

    steps:
      - name: Require explicit production confirmation
        env:
          CONFIRMATION: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DEPLOY_ZB"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        name: Check out the dispatched commit exactly
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = ""
          git cat-file -e "${GITHUB_SHA}^{commit}"

      - name: Deploy an exact Git bundle through the restricted local endpoint
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          bundle_file="$(mktemp)"
          bundle_ref="refs/tags/gha-zb-deploy-$GITHUB_SHA"
          cleanup() {
            git update-ref -d "$bundle_ref" "$GITHUB_SHA" 2>/dev/null || true
            rm -f "$bundle_file"
          }
          trap cleanup EXIT

          git update-ref "$bundle_ref" "$GITHUB_SHA"
          git bundle create "$bundle_file" "$bundle_ref"
          git bundle verify "$bundle_file"
          test "$(git bundle list-heads "$bundle_file")" = "$GITHUB_SHA $bundle_ref"

          sudo -n -- /usr/local/sbin/gha-zb-deploy-wrapper deploy "$GITHUB_SHA" < "$bundle_file"
