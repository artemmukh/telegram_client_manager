services:
  bot-zb:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - ./deploy/zb.env
    environment:
      BOT_INSTANCE: zb
      DATA_BASE: /app/data/zb.db
    volumes:
      - /srv/medical-bot/data:/app/data
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    init: true
    stop_grace_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
